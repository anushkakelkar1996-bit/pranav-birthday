<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Birthday Quest</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<!-- PWA / mobile -->
<meta name="theme-color" content="#0a0a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bday Quest">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a14'/><text y='70' font-size='70' x='12'>🍄</text></svg>">
<style>
:root { color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100dvh;
  background: #0a0a14;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'Press Start 2P', monospace;
  overflow: hidden;
  touch-action: none;
}

#wrap {
  position: relative;
  width: min(100vw, calc(100dvh * 1.6));
}

#gc {
  width: 100%;
  aspect-ratio: 8 / 5;
  display: block;
  border: 3px solid #FFD700;
  box-shadow: 0 0 0 1px #7a4a00, 0 0 32px rgba(255,200,0,0.18);
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

/* ── PORTRAIT MOBILE: fill full screen ── */
@media (orientation: portrait) and (max-width: 768px) {
  body { justify-content: flex-start; }
  #wrap {
    width: 100vw;
    height: 100dvh;
  }
  #gc {
    aspect-ratio: unset !important;
    object-fit: contain;
    background: linear-gradient(#4e8aed 50%, #7a5730 50%);
    width: 100% !important;
    height: 100% !important;
  }

  /* Start screen: compact layout that fits portrait */
  #ss {
    padding: 14px 14px 50px;
    justify-content: flex-start;
    padding-top: 18px;
    overflow-y: auto;
    gap: 0;
  }
  #wrap #ss { padding-top: 40px; }
  #ss .ss-cake { margin-bottom: 22px; }
  #ss .candles { height: 28px; gap: 16px; }
  #ss .ss-title {
    font-size: clamp(.6rem, 4.2vw, .95rem);
    padding: 22px 16px 10px;
    line-height: 1.8;
  }
  #ss .ss-title::after { left: -10px; right: -10px; }
  #ss .ss-sub {
    font-size: clamp(.3rem, 2.2vw, .44rem);
    margin-bottom: 12px;
    line-height: 2.2;
    padding: 10px 14px 12px;
  }
  #ss .gift-a, #ss .gift-b { width: 38px; height: 36px; }
  #ss .cup { width: 36px; height: 36px; }
  #ss .gift-c { width: 30px; height: 28px; }
  #ss .p1 { left: 4%; } #ss .p2 { left: 24%; } #ss .p3 { right: 24%; } #ss .p4 { right: 4%; }
  #ss .bal { bottom: 34px; width: 22px; height: 40px; }
  #ss .b2 { left: 18px; bottom: 44px; } #ss .b3 { left: 9px; }
  /* 2×2 gift grid instead of 4-in-a-row */
  .gg {
    display: grid !important;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
    width: 100%;
    max-width: 300px;
  }
  .gc {
    min-width: unset;
    padding: 8px 10px;
  }
  .gc .gd { font-size: .38rem; margin-bottom: 4px; }
  .gc .gi { font-size: 1.2rem; }
  .gc .gs { font-size: .34rem; margin-top: 4px; }
  #playBtn {
    padding: 10px 24px;
    font-size: clamp(.42rem, 3vw, .62rem);
  }
  .ch { margin-top: 8px; font-size: .32rem; }
}

/* ── START SCREEN ── */
#ss {
  position: absolute; inset: 0;
  background: #5c94fc;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10; padding: 20px; text-align: center;
  gap: 0; overflow: hidden;
}

/* Pixel clouds */
#ss::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 28px 14px at 80px 60px, #fff 100%, transparent 100%),
    radial-gradient(ellipse 18px 18px at 72px 52px, #fff 100%, transparent 100%),
    radial-gradient(ellipse 18px 18px at 96px 52px, #fff 100%, transparent 100%),
    radial-gradient(ellipse 36px 18px at 340px 44px, #fff 100%, transparent 100%),
    radial-gradient(ellipse 22px 22px at 328px 36px, #fff 100%, transparent 100%),
    radial-gradient(ellipse 22px 22px at 358px 36px, #fff 100%, transparent 100%),
    radial-gradient(ellipse 26px 13px at 600px 72px, #fff 100%, transparent 100%),
    radial-gradient(ellipse 16px 16px at 593px 63px, #fff 100%, transparent 100%),
    radial-gradient(ellipse 16px 16px at 614px 63px, #fff 100%, transparent 100%),
    radial-gradient(ellipse 32px 16px at 700px 30px, #fff 100%, transparent 100%),
    radial-gradient(ellipse 20px 20px at 690px 22px, #fff 100%, transparent 100%),
    radial-gradient(ellipse 20px 20px at 716px 22px, #fff 100%, transparent 100%);
  pointer-events: none;
}

/* Ground strip */
#ss::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 36px;
  background: repeating-linear-gradient(90deg, #5a8a00 0px, #5a8a00 32px, #4a7a00 32px, #4a7a00 64px);
  box-shadow: inset 0 4px 0 #76b000;
  pointer-events: none;
}

.ss-bricks {
  position: absolute; bottom: 36px; left: 0; right: 0;
  height: 24px;
  background: repeating-linear-gradient(90deg, #c84c0c 0px, #c84c0c 30px, #a83808 30px, #a83808 32px);
  box-shadow: inset 0 -3px 0 #8b2e04, inset 0 3px 0 #e06020;
  pointer-events: none;
}

/* Birthday bunting */
.ss-bunting {
  position: absolute; top: 6px; left: 0; right: 0; height: 30px; z-index: 1;
  display: flex; justify-content: space-around; pointer-events: none;
  background: linear-gradient(#fff, #fff) 0 0 / 100% 2px no-repeat;
}
.ss-bunting i {
  width: 22px; height: 26px; margin-top: 2px;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  background: #ff6fa5; transform-origin: top center;
  animation: flap 2.4s ease-in-out infinite alternate;
}
.ss-bunting i:nth-child(4n+2) { background: #ffd23f; animation-delay: -.6s; }
.ss-bunting i:nth-child(4n+3) { background: #3ec7c2; animation-delay: -1.2s; }
.ss-bunting i:nth-child(4n+4) { background: #fff; animation-delay: -1.8s; }
@keyframes flap { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }

/* Pixel-art party props sitting on the bricks */
.ss-props { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.prop { position: absolute; bottom: 60px; display: flex; align-items: flex-end; }
.pp { display: block; image-rendering: pixelated; }
.gift-a, .gift-b { width: 64px; height: 60px; }
.gift-c { width: 46px; height: 43px; }
.cup { width: 58px; height: 58px; }
.p1 { left: 8%; } .p2 { left: 22%; } .p3 { right: 22%; } .p4 { right: 8%; }
.bal { position: absolute; bottom: 56px; width: 32px; height: 59px; transform-origin: bottom center; animation: bob 3s ease-in-out infinite; }
.b1 { left: -4px; }
.b2 { left: 26px; bottom: 66px; animation-delay: -1s; }
.b3 { left: 16px; animation-delay: -2s; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-6px) rotate(3deg); } }
.gift-a { animation: wiggle 4s ease-in-out infinite; transform-origin: bottom center; }
@keyframes wiggle { 0%,88%,100% { transform: rotate(0); } 91% { transform: rotate(-6deg); } 94% { transform: rotate(6deg); } 97% { transform: rotate(-3deg); } }

/* Title = a pixel chocolate cake with frosting + candles */
.ss-cake { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; margin-bottom: 26px; }
.candles { display: flex; gap: 22px; height: 34px; align-items: flex-end; }
.candles i {
  position: relative; width: 10px; height: 20px;
  border: 2px solid #1a0a00; border-bottom: 0;
  background: repeating-linear-gradient(180deg, #fff 0 4px, #ff6fa5 4px 8px);
}
.candles i::before {
  content: ''; position: absolute; left: 50%; top: -15px; width: 10px; height: 12px; margin-left: -5px;
  background: #ffd23f; box-shadow: inset 0 -5px 0 #ff8a1f;
  clip-path: polygon(50% 0, 100% 55%, 80% 100%, 20% 100%, 0 55%);
  transform-origin: bottom center;
  animation: flick .3s steps(2) infinite alternate;
}
.candles i:nth-child(2)::before { animation-delay: -.15s; }
@keyframes flick { to { transform: scale(.85, 1.15) skewX(6deg); } }
.ss-title {
  position: relative;
  background: #7b3f26; color: #ffe066;
  font-size: clamp(.75rem, 3.2vw, 1.45rem);
  letter-spacing: 2px; line-height: 1.6;
  text-shadow: 3px 3px 0 #2b0f05;
  border: 4px solid #1a0a00;
  padding: 26px 30px 14px;
  box-shadow: inset -6px -6px 0 #5a2c18, inset 6px 0 0 #96502f;
}
.ss-title .frost { position: absolute; left: 0; top: 0; width: 100%; height: 18px; }
.ss-title span { position: relative; }
.ss-title b { display: inline-block; color: #fff; text-shadow: 3px 3px 0 #e2457a; animation: hop 1s steps(2) infinite; }
@keyframes hop { 50% { transform: translateY(-3px); } }
/* cake plate */
.ss-title::after {
  content: ''; position: absolute; left: -18px; right: -18px; bottom: -14px; height: 8px;
  background: #f1eef8; border: 3px solid #1a0a00; box-shadow: inset 0 -3px 0 #b9b3cc;
}

/* Subtitle = retro game dialogue box */
.ss-sub {
  position: relative; z-index: 2;
  max-width: min(600px, 94%);
  background: #fffaf0; color: #2b1d3a;
  border: 4px solid #1a0a00;
  box-shadow: inset -4px -4px 0 #eadfc8, 5px 5px 0 rgba(0,0,0,.3);
  padding: 12px 20px 14px; margin-bottom: 16px;
  font-size: clamp(.36rem, 1.25vw, .52rem); line-height: 2.4;
  display: flex; flex-direction: column; gap: 4px;
}
.ss-sub .l1 { color: #c0392b; font-size: 1.12em; }
.ss-sub .gboy { width: 1em; height: 1.25em; vertical-align: -0.2em; margin-left: 4px; display: inline-block; }
.ss-sub::after {
  content: ''; position: absolute; right: 8px; bottom: 6px; width: 8px; height: 6px;
  background: #2b1d3a; clip-path: polygon(0 0, 100% 0, 50% 100%);
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.gg { position: relative; z-index: 2; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 16px; }

.gc {
  background: rgba(0,0,0,.55);
  border: 3px solid rgba(255,255,255,.25);
  border-radius: 4px; padding: 10px 12px;
  min-width: 66px; text-align: center; transition: .2s;
  box-shadow: 3px 3px 0 rgba(0,0,0,.4);
}
.gc.ul { border-color: #4CAF50; background: rgba(30,100,30,.8); box-shadow: 3px 3px 0 #1a5a1a; }
.gc.got { border-color: #FFD700; background: rgba(120,80,0,.8); box-shadow: 3px 3px 0 #7a4a00; }
.gc .gd { color: #FFD700; font-size: .42rem; margin-bottom: 6px; line-height: 2; text-shadow: 1px 1px 0 #000; }
.gc .gi { font-size: 1.4rem; }
.gc .gs { color: #aaa; font-size: .38rem; margin-top: 5px; line-height: 2.2; }
.gc.ul .gs { color: #7fff7f; }
.gc.got .gs { color: #FFD700; }

#playBtn {
  position: relative; z-index: 2;
  background: #E53935; color: #fff;
  border: 3px solid #000; border-bottom: 6px solid #7B1A17;
  padding: 12px 30px;
  font-size: clamp(.5rem, 1.9vw, .75rem);
  font-family: 'Press Start 2P', monospace;
  letter-spacing: 3px; cursor: pointer;
  border-radius: 2px; text-transform: uppercase;
  box-shadow: 4px 4px 0 #000;
  transition: transform .1s, border-bottom-width .1s, box-shadow .1s;
}
#playBtn:hover { background: #ff4a47; }
#playBtn:active { transform: translate(3px,4px); border-bottom-width: 3px; box-shadow: 1px 1px 0 #000; }

.ch {
  position: relative; z-index: 2;
  color: rgba(255,255,255,.55); font-size: .38rem;
  margin-top: 12px; line-height: 2.8;
  text-shadow: 1px 1px 0 #000;
}

/* ── HUD ── */
#hud {
  position: absolute; top: 6px; right: 6px;
  display: flex; gap: 5px; z-index: 5; align-items: center;
}
#homeBtn {
  background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.18);
  border-radius: 4px; color: #fff; font-size: 10px;
  font-family: 'Press Start 2P', monospace;
  padding: 3px 6px; cursor: pointer; line-height: 1;
  transition: background .2s;
}
#homeBtn:hover { background: rgba(80,80,80,.8); }
.hm {
  width: 22px; height: 22px;
  background: rgba(0,0,0,.55);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; transition: all .35s;
}
.hm.got { background: rgba(255,215,0,.22); border-color: #FFD700; }

/* ── GIFT MODAL ── */
#gm {
  display: none; position: absolute; inset: 0;
  background: rgba(0,0,0,.87);
  z-index: 20; align-items: center; justify-content: center;
}
#gm.on { display: flex; }

.gb {
  background: linear-gradient(150deg, #141430 0%, #08080e 100%);
  border: 3px solid #FFD700; border-radius: 14px;
  padding: clamp(18px, 5vw, 36px);
  text-align: center; color: #fff;
  max-width: 92%; width: 380px;
  animation: popIn .4s cubic-bezier(.34,1.56,.64,1);
  position: relative;
}
@keyframes popIn {
  from { transform: scale(.25) translateY(80px); opacity: 0; }
  to   { transform: scale(1)   translateY(0);    opacity: 1; }
}
/* ── GIFT COVERS: one shared frame + unwrap, four themed scenes ── */
.gb { --acc: #FFD700; border-color: var(--acc); border-radius: 8px; overflow: hidden; padding-top: 0; }
.gb-t1 { --acc: #ff6b6b; }
.gb-t2 { --acc: #3ec7c2; }
.gb-t3 { --acc: #c39bff; }
.gb-t4 { --acc: #FFD700; animation: popIn .4s cubic-bezier(.34,1.56,.64,1), partyBorder 1.2s steps(1) infinite; }
@keyframes partyBorder { 0% { border-color: #FFD700; } 25% { border-color: #ff6fa5; } 50% { border-color: #3ec7c2; } 75% { border-color: #c39bff; } }
.gb .gbt { color: var(--acc); }
.gb .gbc { background: var(--acc); opacity: 0; pointer-events: none; transform: translateY(6px); transition: opacity .2s, transform .2s; }
.gb .gbc.show { opacity: 1; pointer-events: auto; transform: none; }
.gbm .twr { visibility: hidden; }

.cv { position: relative; height: 150px; margin: 0 calc(-1 * clamp(18px, 5vw, 36px)) 18px; overflow: hidden; border-bottom: 3px solid var(--acc); }
.cv .pp { position: absolute; display: block; image-rendering: pixelated; }
.cv-tag { position: absolute; top: 8px; left: 8px; z-index: 6; font-size: 6px; letter-spacing: 1px; color: var(--acc); background: rgba(0,0,0,.55); padding: 4px 6px; }
.cv-head { position: absolute; top: 26px; left: 0; right: 0; z-index: 3; text-align: center; font-size: 9px; letter-spacing: 1px; line-height: 1.6; color: #fff; text-shadow: 2px 2px 0 rgba(0,0,0,.6); }

/* shared unwrap: present shakes, bursts open, scene appears */
.cv .cv-open { left: 50%; top: 50%; width: 72px; height: 68px; margin: -34px 0 0 -36px; z-index: 5; animation: cvOpen 1s ease-in forwards; }
@keyframes cvOpen {
  0%, 12% { transform: none; opacity: 1; }
  20% { transform: rotate(-8deg); } 28% { transform: rotate(8deg); }
  36% { transform: rotate(-8deg); } 44% { transform: rotate(8deg); }
  52% { transform: rotate(-4deg) scale(1.05); } 62% { transform: scale(1.1); }
  78% { transform: scale(1.35); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; }
}
.cv-burst { position: absolute; left: 50%; top: 50%; z-index: 4; }
.cv-burst i { position: absolute; width: 6px; height: 6px; margin: -3px; background: #fff; opacity: 0; animation: cvRay .5s ease-out .8s; }
.cv-burst i:nth-child(odd) { background: var(--acc); }
@keyframes cvRay { from { opacity: 1; transform: none; } to { opacity: 0; transform: translate(var(--dx), var(--dy)); } }
.cv-scene { position: absolute; inset: 0; animation: cvReveal .45s steps(4) .8s both; }
@keyframes cvReveal { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }

/* 1 · keychain console: a pixel handheld dangles from a key ring and boots up */
.t1 { background: repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 2px, transparent 2px 4px), radial-gradient(circle at 50% 120%, #3b2a8a, #160f3a 70%); }
.t1 .stars { position: absolute; inset: 0; background: radial-gradient(#fff 1px, transparent 1.5px) 0 0 / 34px 30px; opacity: .35; animation: twinkle 1.6s steps(2) infinite; }
@keyframes twinkle { 50% { opacity: .12; } }
.t1 .kc { position: absolute; left: calc(50% - 42px); top: 4px; width: 84px; height: 140px; transform-origin: 50% 2px; animation: kcSwing 2.4s ease-in-out 1s infinite alternate; }
@keyframes kcSwing { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
.t1 .kc .ring { left: 30px; top: 0; width: 24px; height: 24px; }
.t1 .kc .hh { left: 0; top: 22px; width: 84px; height: 112px; }
.t1 .scr { position: absolute; left: 17.5px; top: 36px; width: 49px; height: 38.5px; overflow: hidden; background: #2a3a2a; animation: boot .5s steps(3) 1.2s forwards; }
@keyframes boot { 0% { background: #2a3a2a; } 40% { background: #e8ffd0; } 100% { background: #9bbc0f; } }
.t1 .scr .txt { position: absolute; left: 0; right: 0; top: 3px; text-align: center; font-size: 5px; line-height: 1.6; color: #0f380f; opacity: 0; animation: scrOn .1s steps(1) 1.6s forwards; }
.t1 .scr .txt span { animation: blink 1s steps(1) 2s infinite; }
@keyframes scrOn { to { opacity: 1; } }
.t1 .scr .gbmush { position: absolute; left: calc(50% - 6px); bottom: 1px; width: 12px; height: 11px; opacity: 0; animation: scrOn .1s steps(1) 1.6s forwards, jump .8s cubic-bezier(.3,0,.7,1) 1.8s infinite; }
@keyframes jump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.t1 .up { position: absolute; left: calc(50% + 50px); top: 54px; font-size: 8px; color: #7dff7a; text-shadow: 2px 2px 0 #000; opacity: 0; animation: oneUp 1.6s linear 2s infinite; }
@keyframes oneUp { 0%, 40% { opacity: 0; transform: translateY(0); } 55% { opacity: 1; } 100% { opacity: 0; transform: translateY(-18px); } }
.t1 .coin { width: 24px; height: 24px; top: 64px; animation: coinSpin .8s steps(4) infinite; }
.t1 .coin.l { left: 14%; } .t1 .coin.r { right: 14%; animation-delay: -.4s; }
@keyframes coinSpin { 50% { transform: scaleX(.15); } }
.t1 .spark { width: 12px; height: 12px; transform: scale(0); animation: spark 1.8s steps(3) infinite; }
.t1 .k1 { left: 26%; top: 26px; animation-delay: 1.2s; } .t1 .k2 { right: 24%; top: 104px; animation-delay: 1.8s; }

/* 2 · sketchbook: a pencil sketches while pixel lilies bloom */
.t2 { background: repeating-linear-gradient(0deg, rgba(90,110,160,.10) 0 1px, transparent 1px 14px), #fff6e6; }
.t2 .cv-head { color: #2b1d3a; text-shadow: 2px 2px 0 #ffc6dc; }
.t2 .sketch { position: absolute; left: 8%; top: 122px; height: 3px; width: 0; background: repeating-linear-gradient(90deg, #55555f 0 6px, transparent 6px 8px); animation: sketchDraw 1.6s steps(16) 1.1s forwards; }
@keyframes sketchDraw { to { width: 38%; } }
.t2 .pc1 { width: 11px; height: 44px; left: 7%; top: 80px; z-index: 2; transform: rotate(205deg); animation: pencilMove 1.6s steps(16) 1.1s forwards, pencilJig .24s steps(2) 1.1s 7; }
@keyframes pencilMove { to { left: 45%; } }
@keyframes pencilJig { 50% { transform: rotate(205deg) translateY(3px); } }
.t2 .pc2, .t2 .pc3 { width: 10px; height: 40px; bottom: 8px; }
.t2 .pc2 { right: 14%; transform: rotate(58deg); }
.t2 .pc3 { right: 9%; transform: rotate(-48deg); }
.t2 .lily { transform: scale(0); animation: bloom .5s steps(4) forwards, sway 3s ease-in-out infinite; }
.t2 .l1 { width: 56px; height: 56px; left: 5%; top: 30px; animation-delay: 1s, 1.5s; }
.t2 .l2 { width: 48px; height: 48px; left: 46%; top: 48px; animation-delay: 1.4s, 1.9s; }
.t2 .l3 { width: 36px; height: 36px; right: 8%; top: 30px; animation-delay: 1.8s, 2.3s; }
@keyframes bloom { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }
@keyframes sway { 50% { transform: rotate(8deg); } }

/* 3 · scent */
.t3 { background: radial-gradient(circle at 50% 100%, #5a3496, #241040 60%, #160a28); }
.t3 .box { width: 56px; height: 53px; left: calc(50% - 28px); bottom: 8px; transform-origin: bottom center; animation: wiggle 3s ease-in-out 1.4s infinite; }
.t3 .wisp { width: 15px; height: 40px; bottom: 58px; opacity: 0; animation: wisp 2.6s ease-out infinite; }
.t3 .w1 { left: calc(50% - 32px); animation-delay: 1.2s; }
.t3 .w2 { left: calc(50% - 7px); animation-delay: 1.9s; }
.t3 .w3 { left: calc(50% + 18px); animation-delay: 2.6s; }
@keyframes wisp { 0% { opacity: 0; transform: translateY(10px) scale(.7); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(6px, -40px) scale(1.15); } }
.t3 .spark { width: 12px; height: 12px; transform: scale(0); animation: spark 1.8s steps(3) infinite; }
.t3 .k1 { left: 16%; top: 54px; animation-delay: 1.1s; }
.t3 .k2 { right: 18%; top: 66px; animation-delay: 1.7s; }
.t3 .k3 { left: 26%; top: 104px; animation-delay: 2.3s; }
.t3 .k4 { right: 25%; top: 108px; animation-delay: 1.4s; }
@keyframes spark { 0%, 100% { transform: scale(0); } 50% { transform: scale(1); } }

/* 4 · party */
.t4 { background: #140a24; }
.t4 .beam { position: absolute; top: -10px; left: calc(50% - 40px); width: 80px; height: 190px; transform-origin: 50% 0; clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%); opacity: .35; animation: sweep 2.2s ease-in-out infinite alternate; }
.t4 .b1 { background: linear-gradient(#ffd23f, transparent); }
.t4 .b2 { background: linear-gradient(#ff6fa5, transparent); animation-delay: -1.1s; }
.t4 .b3 { background: linear-gradient(#3ec7c2, transparent); animation-duration: 3s; }
@keyframes sweep { from { transform: rotate(-40deg); } to { transform: rotate(40deg); } }
.t4 .ball { width: 36px; height: 36px; left: calc(50% - 18px); top: 4px; z-index: 2; transform-origin: 50% -10px; animation: ballSwing 2s ease-in-out infinite alternate; }
@keyframes ballSwing { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
.t4 .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: 1fr 1fr; gap: 2px; background: #000; }
.t4 .floor i { background: #3a2266; animation: tile 1.2s steps(1) infinite; }
.t4 .floor i:nth-child(3n) { animation-delay: -.3s; }
.t4 .floor i:nth-child(3n+1) { animation-delay: -.6s; }
.t4 .floor i:nth-child(4n) { animation-delay: -.9s; }
@keyframes tile { 0% { background: #ff6fa5; } 25% { background: #3a2266; } 50% { background: #3ec7c2; } 75% { background: #ffd23f; } }
.t4 .note { width: 18px; height: 23px; bottom: 36px; opacity: 0; animation: note 2.4s ease-out infinite; }
.t4 .n1 { left: 14%; animation-delay: 1.1s; }
.t4 .n2 { right: 16%; animation-delay: 1.9s; }
.t4 .n3 { left: 68%; animation-delay: 2.7s; }
@keyframes note { 0% { opacity: 0; transform: translateY(0) rotate(-10deg); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(10px, -70px) rotate(12deg); } }
.t4 .cv-head { top: 54px; font-size: 11px; color: #FFD700; text-shadow: 2px 2px 0 #e2457a; }

}
.gbc:hover { background: #ffc107; }

/* ── TOUCH CONTROLS ── */
#tc {
  position: absolute; bottom: 0; left: 0; right: 0;
  display: none; justify-content: space-between; align-items: flex-end;
  padding: 0 10px 10px; z-index: 8;
  pointer-events: none;
}
@media (hover: none) and (pointer: coarse) { #tc { display: flex; } .ch { display: none; } }
.tg { display: flex; gap: 6px; pointer-events: all; }
.tb {
  width: 66px; height: 66px;
  background: rgba(0,0,0,.38);
  border: 2.5px solid rgba(255,255,255,.30);
  border-bottom: 4px solid rgba(255,255,255,.12);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.45rem; color: rgba(255,255,255,.9); cursor: pointer;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  transition: background .05s, transform .05s;
  backdrop-filter: blur(4px);
  box-shadow: 0 4px 14px rgba(0,0,0,.4);
}
.tb.pressed, .tb:active {
  background: rgba(255,255,255,.22);
  transform: scale(.92);
  border-bottom-width: 2px;
}
#tbJ {
  width: 74px; height: 74px; font-size: 1.65rem;

}
#tbJ.pressed, #tbJ:active { background: rgba(220,50,50,.6); }

/* ── NFC SPLASH ── */
#nfcSplash {
  position: absolute; inset: 0;
  background: linear-gradient(160deg, #1a1a3a 0%, #0a0a14 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 50; text-align: center; padding: 24px;
  gap: 16px;
}
.nfc-shroom {
  font-size: clamp(3rem, 15vw, 5rem);
  animation: nfcBob 0.9s ease-in-out infinite alternate;
  filter: drop-shadow(0 0 24px rgba(255,215,0,.6));
}
@keyframes nfcBob {
  from { transform: translateY(0) scale(1); }
  to   { transform: translateY(-18px) scale(1.06); }
}
.nfc-title {
  color: #FFD700;
  font-size: clamp(.55rem, 3.2vw, 1rem);
  text-shadow: 3px 3px 0 #7a3000;
  line-height: 2.2; letter-spacing: 1px;
}
.nfc-sub {
  color: rgba(255,255,255,.8);
  font-size: clamp(.32rem, 1.5vw, .5rem);
  line-height: 2.6;
  text-shadow: 1px 1px 0 #000;
  max-width: 280px;
}
.nfc-tap {
  color: #4ECDC4;
  font-size: clamp(.36rem, 1.5vw, .48rem);
  animation: nfcBlink 1s step-start infinite;
  margin-top: 8px;
}
@keyframes nfcBlink { 50% { opacity: 0; } }
.nfc-stars {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden;
}
/* pixel party: faint starfield + tumbling block confetti + twinkling sparkles */
.nfc-stars::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(#fff 1px, transparent 1.5px) 0 0 / 38px 34px;
  opacity: .25; animation: twinkle 1.8s steps(2) infinite;
}
.nfc-conf { position: absolute; top: -4%; image-rendering: pixelated; animation: nfcFall linear infinite, nfcSpin steps(4) infinite; }
@keyframes nfcFall { from { top: -4%; } to { top: 104%; } }
@keyframes nfcSpin { to { transform: rotate(360deg); } }
.nfc-spark { position: absolute; width: 14px; height: 14px; transform: scale(0); animation: nfcSpark 1.6s steps(3) infinite; image-rendering: pixelated; }
@keyframes nfcSpark { 0%, 100% { transform: scale(0); } 50% { transform: scale(1); } }
.nfc-shroom, .nfc-title, .nfc-sub, .nfc-tap { position: relative; z-index: 1; }
.nfc-shroom svg { display: block; width: clamp(100px, 30vw, 140px); height: auto; image-rendering: pixelated; }
@media (prefers-reduced-motion: reduce) { .nfc-conf, .nfc-spark, .nfc-stars::before { animation: none; } .nfc-conf { display: none; } .nfc-spark { transform: none; } }

/* ── CONFETTI ── */
#cfc {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 30;
  width: 100%; height: 100%;
}

<script>
// ══════════════════════════════════════════
// 🎁 GIFTS: replace placeholder messages!
// ══════════════════════════════════════════
const GIFTS = [
  {
    id: 0,
    unlock: new Date(2026, 9, 6),    // Oct 6
    label: 'Oct 6',
    emoji: '🎁',
    title: 'Surprise #1 Unlocked!',

  },
  {

    unlock: new Date(2026, 9, 8),    // Oct 8
    label: 'Oct 8',

    title: 'Surprise #2 Unlocked!',
    msg: "This one's for the creative side of you that deserves more airtime\n\nGuess what it is to get your gift"
  },
  {
    id: 2,
    unlock: new Date(2026, 9, 10),   // Oct 10
    label: 'Oct 10',
    emoji: '🌟',
    title: 'Surprise #3 Unlocked!',
    msg: "One more day!! Fair warning, this one you're going to smell before you even open it\n\nGuess what it is to get your gift"

  {

    msg: "HAPPY 30!!\n\nOkay this is the one I've been most excited about. You've been talking about this forever and I finally did something about it\n\nGuess what it is to get your gift"
  }
];

// ══════════════════════════════════════════
// CANVAS
// ══════════════════════════════════════════
const canvas = document.getElementById('gc');
const ctx    = canvas.getContext('2d');
const CW = 800, CH = 500;

// ══════════════════════════════════════════
// PERSISTENCE
// ══════════════════════════════════════════
let saved = [];
// add ?reset to the link to wipe saved progress on this device (handy for testing)
if (new URLSearchParams(location.search).has('reset')) { try { localStorage.removeItem('bdayV2'); } catch(e){} }
try { saved = JSON.parse(localStorage.getItem('bdayV2') || '[]'); } catch(e){}
function persist() { try { localStorage.setItem('bdayV2', JSON.stringify(saved)); } catch(e){} }

function isUnlocked(g) {
  const n = new Date(); n.setHours(0,0,0,0);
  return n >= g.unlock;
}
function isGot(g) { return saved.includes(g.id); }
function daysUntil(d) {
  const n = new Date(); n.setHours(0,0,0,0);
  return Math.max(0, Math.ceil((d - n) / 86400000));
}

// ══════════════════════════════════════════
// START SCREEN
// ══════════════════════════════════════════
function buildGrid() {
  const el = document.getElementById('gg');
  el.innerHTML = '';
  GIFTS.forEach(g => {
    const got = isGot(g), ul = isUnlocked(g);
    const d = document.createElement('div');
    d.className = `gc${got?' got':ul?' ul':''}`;
    d.innerHTML = `
      <div class="gd">${g.label}</div>
      <div class="gi">${got?'✅':ul?g.emoji:'🔒'}</div>
      <div class="gs">${got?'Found!':ul?'Ready!':'in '+daysUntil(g.unlock)+'d'}</div>`;
    el.appendChild(d);
  });
}
buildGrid();

function startGame() {
  document.getElementById('ss').style.display = 'none';
  running = true;
  requestAnimationFrame(loop);
}

function goHome() {
  running = false;
  buildGrid();
  document.getElementById('ss').style.display = 'flex';
}

// ══════════════════════════════════════════
// WORLD  (3 400 px wide)
// ══════════════════════════════════════════
const GY = 440, WW = 3400;

const PLATS = [
  {x:0,    y:GY,   w:WW,  h:60},

  {x:190,  y:352,  w:130, h:18},
  {x:360,  y:282,  w:100, h:18},
  {x:510,  y:360,  w:110, h:18},
  {x:668,  y:294,  w:110, h:18},

  {x:830,  y:224,  w:140, h:18},
  {x:1028, y:310,  w:100, h:18},

  {x:1182, y:368,  w:110, h:18},
  {x:1342, y:308,  w:100, h:18},
  {x:1482, y:244,  w:100, h:18},

  {x:1620, y:178,  w:130, h:18},

  {x:1810, y:350,  w:110, h:18},
  {x:1962, y:288,  w:100, h:18},
  {x:2108, y:222,  w:100, h:18},
  {x:2248, y:157,  w:100, h:18},

  {x:2388, y:152,  w:170, h:18},

  {x:2630, y:358,  w:140, h:18},
  {x:2820, y:308,  w:130, h:18},
  {x:3012, y:358,  w:160, h:18},
];

const QBLKS  = [{x:340,y:202},{x:804,y:142},{x:1572,y:96},{x:2228,y:72}];
const BRICKS = [
  {x:80,y:GY-70},{x:96,y:GY-70},{x:112,y:GY-70},
  {x:654,y:GY-70},{x:670,y:GY-70},
  {x:2672,y:GY-86},{x:2688,y:GY-86},{x:2704,y:GY-86},
];
const PIPES = [{x:446,h:78},{x:1112,h:64},{x:2520,h:98}];

const MUSHS = [
  {x:226,  y:352-30, gId:0, got:false, sl:false, st:null},
  {x:872,  y:224-30, gId:1, got:false, sl:false, st:null},
  {x:1652, y:178-30, gId:2, got:false, sl:false, st:null},
  {x:2438, y:152-30, gId:3, got:false, sl:false, st:null},
];
MUSHS.forEach(m => { if(isGot(GIFTS[m.gId])) m.got = true; });

const CLOUDS = Array.from({length:22}, (_,i) => ({
  x: i*182+Math.random()*80, y:32+Math.random()*72, s:.72+Math.random()*.82
}));
const HILLS = Array.from({length:16}, (_,i) => ({
  x: i*242+Math.random()*80, r:105+Math.random()*115
}));

// ══════════════════════════════════════════
// PLAYER
// ══════════════════════════════════════════
const P = {
  x:52, y:GY-50, w:28, h:48,
  vx:0, vy:0, onGround:false,
  dir:1, frame:0, fT:0, moving:false, jumping:false,
};
const GRAV=0.52, JUMP=-12, SPD=4.3, MFALL=14;

// ══════════════════════════════════════════
// INPUT
// ══════════════════════════════════════════
const keys = {};

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if((e.code==='ArrowUp'||e.code==='Space') && P.onGround && running && !mOpen) doJump();
  if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function addTouch(id, kc, tap) {
  const el = document.getElementById(id);
  if(!el) return;
  const dn = e => {
    e.preventDefault();
    el.classList.add('pressed');
    tap ? tap() : keys[kc]=true;
  };
  const up = e => {
    e.preventDefault();
    el.classList.remove('pressed');
    if(!tap) keys[kc]=false;
  };
  el.addEventListener('touchstart', dn, {passive:false});
  el.addEventListener('touchend',   up, {passive:false});
  el.addEventListener('touchcancel',up, {passive:false});
  el.addEventListener('mousedown',  dn);
  el.addEventListener('mouseup',    up);
}
addTouch('tbL','ArrowLeft');
addTouch('tbR','ArrowRight');
addTouch('tbJ', null, () => { if(P.onGround && running && !mOpen) doJump(); });

function doJump() {
  P.vy = JUMP; P.onGround = false; P.jumping = true;
  sfxJump(); buzz(18);
}

// ═════════════════════════════════
// CAMERA
// ══════════════════════════════════════════
let camX = 0;
function updateCam() {
  camX += (P.x - CW/3 - camX) * 0.09;
  camX = Math.max(0, Math.min(WW - CW, camX));
}

// ══════════════════════════════════════════
// PHYSICS + COLLISION
// ══════════════════════════════════════════
function update() {
  P.moving = false;
  if(keys['ArrowLeft'])       { P.vx=-SPD; P.dir=-1; P.moving=true; }
  else if(keys['ArrowRight']) { P.vx= SPD; P.dir= 1; P.moving=true; }
  else P.vx *= 0.6;

  P.x = Math.max(0, Math.min(WW-P.w, P.x + P.vx));
  P.vy = Math.min(P.vy + GRAV, MFALL);
  P.y += P.vy;
  P.onGround = false;

  for(const pl of PLATS) {
    if(P.x+P.w > pl.x && P.x < pl.x+pl.w) {
      const f = P.y + P.h;
      if(f >= pl.y && f <= pl.y+pl.h+5 && P.vy >= 0) {
        P.y = pl.y - P.h; P.vy = 0; P.onGround = true; P.jumping = false;
      }
    }
  }

  if(P.y > CH + 80) { P.x=52; P.y=GY-P.h; P.vx=0; P.vy=0; }

  if(P.onGround && P.moving) {
    if(++P.fT >= 7) { P.frame=(P.frame+1)%3; P.fT=0; }
  } else { P.frame = P.jumping ? 3 : 0; P.fT=0; }

  MUSHS.forEach(m => {
    if(m.got) return;
    if(P.x < m.x+24 && P.x+P.w > m.x && P.y < m.y+32 && P.y+P.h > m.y) {
      const g = GIFTS[m.gId];
      if(isUnlocked(g)) {
        m.got = true;
        if(!saved.includes(g.id)) { saved.push(g.id); persist(); }
        updateHUD();
        spawnParts(m.x+12, m.y+12);
        sfxCoin();
        buzz([60, 40, 60, 40, 140]); // collect mushroom pattern
        openModal(g);
      } else if(!m.st) {
        m.sl = true;
        m.st = setTimeout(() => { m.sl=false; m.st=null; }, 2200);
      }
    }
  });

  updateCam();
}

// ══════════════════════════════════════════
// PARTICLES
// ══════════════════════════════════════════
let parts = [];
const PCOLS = ['#FFD700','#FF6B6B','#4ECDC4','#fff','#C792EA','#68EF8A'];

function spawnParts(x, y) {
  for(let i=0;i<18;i++) {
    parts.push({
      x, y,
      vx:(Math.random()-.5)*10,
      vy:Math.random()*-10-1,
      s:3+Math.random()*5,
      c:PCOLS[i%PCOLS.length],
      l:1
    });
  }
}
function tickParts() {
  parts = parts.filter(p => p.l > 0);
  parts.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=0.38; p.l-=0.022; });
}

// ══════════════════════════════════════════
// DRAW: BACKGROUND
// ══════════════════════════════════════════
function dBg() {
  const g = ctx.createLinearGradient(0,0,0,CH);
  g.addColorStop(0,'#4e8aed'); g.addColorStop(1,'#a8c4f8');
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);
}
function dHills() {
  HILLS.forEach(h => {
    const hx = h.x - camX*0.2;
    if(hx<-h.r-10||hx>CW+h.r+10) return;
  ctx.fillStyle='#5faa3a';
    ctx.beginPath(); ctx.arc(hx,GY,h.r,Math.PI,0); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#78c84e';
    ctx.beginPath(); ctx.arc(hx,GY,h.r*.62,Math.PI,0); ctx.closePath(); ctx.fill();
  });
}
function dClouds(t) {
  ctx.fillStyle='rgba(255,255,255,.93)';
  CLOUDS.forEach(c => {
    const cx = ((c.x - camX*.32 + t*.014) % (WW*.5)) * (CW/(WW*.5));
    const cy = c.y + Math.sin(t*.0004+c.x*.01)*5;
    const s = c.s;
    ctx.beginPath();
    ctx.arc(cx,cy,26*s,0,Math.PI*2);
    ctx.arc(cx+20*s,cy-9*s,19*s,0,Math.PI*2);
    ctx.arc(cx+38*s,cy,23*s,0,Math.PI*2);
    ctx.fill();
  });
}

// ══════════════════════════════════════════
// DRAW: TERRAIN
// ══════════════════════════════════════════
function dGround() {
  ctx.fillStyle='#5b9e38'; ctx.fillRect(0,GY,CW,14);
  ctx.fillStyle='#6cbf42'; ctx.fillRect(0,GY+2,CW,6);
  ctx.fillStyle='#7a5730'; ctx.fillRect(0,GY+14,CW,CH-GY-14);
  ctx.strokeStyle='#6a4a28'; ctx.lineWidth=1;
  const ox = -(camX%16);
  for(let x=ox;x<CW;x+=16) { ctx.beginPath();ctx.moveTo(x,GY+14);ctx.lineTo(x,CH);ctx.stroke(); }
  for(let y=GY+20;y<CH;y+=16) { ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(CW,y);ctx.stroke(); }
}
function dPlats() {
  for(let i=1;i<PLATS.length;i++) {
    const p=PLATS[i]; const sx=p.x-camX;
    if(sx>CW+20||sx+p.w<-20) continue;
  ctx.fillStyle='#5b9e38'; ctx.fillRect(sx,p.y,p.w,7);
    ctx.fillStyle='#6cbf42'; ctx.fillRect(sx+2,p.y+1,p.w-4,4);
    ctx.fillStyle='#c49a46'; ctx.fillRect(sx,p.y+7,p.w,p.h-7);
    ctx.strokeStyle='#8a6522'; ctx.lineWidth=1; ctx.strokeRect(sx,p.y,p.w,p.h);
  }
}
function dPipes() {
  PIPES.forEach(pipe => {
    const sx=pipe.x-camX;
    if(sx>CW+40||sx<-50) return;
    const pw=40,ph=pipe.h,py=GY-ph;
    ctx.fillStyle='#2a8430'; ctx.fillRect(sx,py,pw,ph);
    ctx.fillStyle='#1e6024'; ctx.fillRect(sx,py,6,ph);
    ctx.fillStyle='#4ab850'; ctx.fillRect(sx+6,py,5,ph);
    ctx.fillStyle='#2a8430'; ctx.fillRect(sx-3,py,pw+6,15);
    ctx.fillStyle='#1e6024'; ctx.fillRect(sx-3,py,6,15);
    ctx.fillStyle='#4ab850'; ctx.fillRect(sx+3,py,5,15);
  });
}
function dQBlk(bx,by,t) {
  ctx.fillStyle='#cc7a00'; ctx.fillRect(bx,by,20,20);
  ctx.fillStyle='#f8a400'; ctx.fillRect(bx+2,by+2,16,16);
  ctx.fillStyle='#ffc830'; ctx.fillRect(bx+2,by+2,5,5);
  if(Math.floor(t/450)%2===0) {
    ctx.fillStyle='#6b3c00';
    ctx.fillRect(bx+7,by+4,5,2); ctx.fillRect(bx+6,by+6,7,2);
    ctx.fillRect(bx+7,by+9,5,2); ctx.fillRect(bx+7,by+13,5,2);
  }
}
function dBrick(bx,by) {
  ctx.fillStyle='#c43b28'; ctx.fillRect(bx,by,16,16);
  ctx.strokeStyle='#8b2500'; ctx.lineWidth=1; ctx.strokeRect(bx,by,16,16);
  ctx.fillStyle='#8b2500';
  ctx.fillRect(bx+3,by+7,10,1);
  ctx.fillRect(bx,by+3,6,1); ctx.fillRect(bx+9,by+3,7,1);
}
function dDecor(t) {
  QBLKS.forEach(b => { const sx=b.x-camX; if(sx>CW+30||sx<-30)return; dQBlk(sx,b.y,t); });
  BRICKS.forEach(b=>{ const sx=b.x-camX; if(sx>CW+30||sx<-30)return; dBrick(sx,b.y); });
}
function dFlag(t) {
  const fx=3140-camX;
  if(fx>CW+30||fx<-30) return;
  ctx.fillStyle='#6b4c28'; ctx.fillRect(fx,GY-188,5,188);
  const w=Math.sin(t*.004)*8;
  ctx.fillStyle='#e53935';
  ctx.beginPath();
  ctx.moveTo(fx+5,GY-186); ctx.lineTo(fx+56+w,GY-163); ctx.lineTo(fx+5,GY-140);
  ctx.fill();
}

// ══════════════════════════════════════════
// DRAW: MUSHROOMS
// ══════════════════════════════════════════
const CAP_COLS = ['#e03030','#d4922a','#2899c8','#8850d0'];

function dMush(m, t) {
  const gift = GIFTS[m.gId];
  const sx = m.x - camX;
  if(sx>CW+30||sx<-30) return;

  const ul = isUnlocked(gift);
  const bob = m.got ? 0 : Math.sin(t*.004+m.gId*1.4)*3.5;
  const sy = m.y + bob;

  ctx.fillStyle = m.got ? '#333' : '#f0ddb0';
  ctx.fillRect(sx+9,sy+18,8,14);

  ctx.fillStyle='rgba(0,0,0,.12)';
  ctx.beginPath(); ctx.ellipse(sx+13,sy+22,12,4,0,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = m.got ? '#444' : ul ? CAP_COLS[m.gId] : '#4a4a4a';
  ctx.beginPath(); ctx.arc(sx+13,sy+13,13,Math.PI,0); ctx.closePath(); ctx.fill();

  if(ul && !m.got) {
    ctx.fillStyle='rgba(255,255,255,.9)';
    [[sx+8,sy+10,3.8],[sx+18,sy+8,3],[sx+15,sy+16,2.2]].forEach(([x,y,r])=>{      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    });
  }
  // Locked state question mark overlay
  if(!ul) {
    ctx.globalAlpha=0.55;
    ctx.fillStyle='#111';
    ctx.fillRect(sx,sy,26,32);
    ctx.globalAlpha=1;
    ctx.fillStyle='#fff';
    ctx.font='bold 13px monospace';
    ctx.textAlign='center';
    ctx.fillText('?',sx+13,sy+20);
    ctx.textAlign='left';
  }
  // "Too soon" shake tooltip
  if(m.sl) {
    ctx.fillStyle='rgba(0,0,0,.72)';
    ctx.fillRect(sx-18,sy-22,62,16);
    ctx.fillStyle='#FFD700';
    ctx.font='7px "Press Start 2P",monospace';
    ctx.textAlign='center';
    ctx.fillText('NOT YET!',sx+13,sy-11);
    ctx.textAlign='left';
  }
}

function dMushs(t) { MUSHS.forEach(m => dMush(m,t)); }

// ══════════════════════════════════════════
// PLAYER DRAWING (pixel-art Mario-style)
// ══════════════════════════════════════════
function dPlayer() {
  const sx = Math.round(P.x - camX);
  const sy = Math.round(P.y);

  ctx.save();
  if(P.dir < 0) {
    ctx.translate(sx + P.w/2, 0);
    ctx.scale(-1,1);
    ctx.translate(-(sx + P.w/2), 0);
  }

  const px = sx, py = sy;

  // Shadow
  ctx.fillStyle='rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(px+14,py+48,11,4,0,0,Math.PI*2); ctx.fill();

  // Shoes
  ctx.fillStyle='#3e2000';
  ctx.fillRect(px+1,py+40,12,8);
  ctx.fillRect(px+15,py+40,12,8);
  ctx.fillStyle='#5c3300';
  ctx.fillRect(px+1,py+40,12,3);
  ctx.fillRect(px+15,py+40,12,3);

  // Pants / overalls (blue)
  ctx.fillStyle='#1655b5';
  ctx.fillRect(px+3,py+28,22,14);
  ctx.fillStyle='#2060cc';
  ctx.fillRect(px+5,py+26,7,6); // left suspender
  ctx.fillRect(px+16,py+26,7,6); // right suspender
  ctx.fillStyle='#1040a0';
  ctx.fillRect(px+12,py+34,4,8); // seam

  // Shirt (red)
  ctx.fillStyle='#d92b2b';
  ctx.fillRect(px+2,py+20,24,12);
  ctx.fillStyle='#f03333';
  ctx.fillRect(px+3,py+20,6,8); // left highlight
  ctx.fillStyle='#b52020';
  ctx.fillRect(px+20,py+22,4,10); // right shadow

  // Head skin
  ctx.fillStyle='#ffca88';
  ctx.fillRect(px+4,py+8,20,14);
  ctx.fillStyle='#f0b870';
  ctx.fillRect(px+20,py+10,4,10); // right shadow
  ctx.fillRect(px+4,py+18,20,4);  // chin shadow

  // Hat (red)
  ctx.fillStyle='#d92b2b';
  ctx.fillRect(px+2,py+2,24,9);
  ctx.fillRect(px+0,py+8,28,5);   // brim
  ctx.fillStyle='#f03333';
  ctx.fillRect(px+4,py+2,8,5);    // highlight

  // Eyes
  ctx.fillStyle='#1a0a00';
  ctx.fillRect(px+8, py+12,4,4);
  ctx.fillRect(px+17,py+12,4,4);
  ctx.fillStyle='#fff';
  ctx.fillRect(px+9, py+12,2,2);
  ctx.fillRect(px+18,py+12,2,2);

  // Nose
  ctx.fillStyle='#e09050';
  ctx.fillRect(px+13,py+15,4,3);

  // Mustache
  ctx.fillStyle='#5c3000';
  ctx.fillRect(px+6, py+17,16,3);
  ctx.fillRect(px+4, py+18,4,2);
  ctx.fillRect(px+20,py+18,4,2);

  // Walking leg animation
  if(P.onGround && P.moving) {
    const fr = P.frame % 2;
    if(fr===0) {
      ctx.fillStyle='#1040a0';
      ctx.fillRect(px+3,py+38,11,4);
      ctx.fillRect(px+14,py+36,11,6);
    } else {
      ctx.fillStyle='#1040a0';
      ctx.fillRect(px+3,py+36,11,6);
      ctx.fillRect(px+14,py+38,11,4);
    }
  } else if(P.jumping) {
    // Legs up
    ctx.fillStyle='#1040a0';
    ctx.fillRect(px+3, py+36,11,4);
    ctx.fillRect(px+14,py+36,11,4);
  }

  ctx.restore();
}

// ══════════════════════════════════════════
// PARTICLES
// ══════════════════════════════════════════
function dParts() {
  parts.forEach(p => {
    ctx.globalAlpha = Math.max(0,p.l);
    ctx.fillStyle = p.c;
    const s = p.s * p.l;
    ctx.fillRect(p.x - s/2, p.y - s/2, s, s);
  });
  ctx.globalAlpha = 1;
}

// ══════════════════════════════════════════
// HUD
// ══════════════════════════════════════════
function updateHUD() {
  MUSHS.forEach((m,i) => {
    const el = document.getElementById('h'+i);
    if(!el) return;
    const ul = isUnlocked(GIFTS[m.gId]);
    if(m.got) {
      el.textContent = '✅';
      el.classList.add('got');
    } else if(ul) {
      el.textContent = '🍄';
      el.classList.remove('got');
      el.style.opacity = '1';
    } else {
      el.textContent = '🍄';
      el.classList.remove('got');
      el.style.opacity = '0.38';
    }
  });
}
updateHUD();

// AUDIO (Web Audio API, no external deps)
// ══════════════════════════════════════════
let AC = null;
function ac() {
  if(!AC) try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
  return AC;
}
function tone(freq,dur,type,vol) {
  const a=ac(); if(!a) return;
  try {
    const o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type=type||'square'; o.frequency.value=freq;
    const t=a.currentTime;
    g.gain.setValueAtTime(vol||0.07,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t); o.stop(t+dur);
  } catch(e){}
}
function sfxJump() { tone(310,0.06); setTimeout(()=>tone(420,0.09),45); }
function sfxCoin() { tone(660,0.07); setTimeout(()=>tone(880,0.13),55); }
function buzz(pat) { try { navigator.vibrate(pat); } catch(e){} }

// CONFETTI CANVAS (#cfc)
// ══════════════════════════════════════════
let cfcEl, cfcCtx, cparts=[];
function launchConfetti() {
  cfcEl = document.getElementById('cfc');
  if(!cfcEl) return;
  cfcCtx = cfcEl.getContext('2d');
  cfcEl.width = window.innerWidth; cfcEl.height = window.innerHeight;
  cparts = [];
  for(let i=0;i<140;i++) {
    cparts.push({
      x: Math.random()*cfcEl.width, y: -20-Math.random()*120,
      vx: (Math.random()-.5)*5, vy: 3+Math.random()*4,
      s: 7+Math.random()*7, r: Math.random()*Math.PI*2, vr: (Math.random()-.5)*.18,
      c: ['#FFD700','#FF6B6B','#4ECDC4','#C792EA','#68EF8A','#fff','#f39c12','#e74c3c'][Math.floor(Math.random()*8)]
    });
  }
  animConf();
}
function animConf() {
  if(!cfcCtx || cparts.length===0) { if(cfcEl) cfcCtx.clearRect(0,0,cfcEl.width,cfcEl.height); return; }
  cfcCtx.clearRect(0,0,cfcEl.width,cfcEl.height);
  cparts = cparts.filter(c=>c.y<cfcEl.height+30);
  cparts.forEach(c=>{
    c.x+=c.vx; c.y+=c.vy; c.r+=c.vr; c.vy+=0.04;
    cfcCtx.save();
    cfcCtx.translate(c.x,c.y); cfcCtx.rotate(c.r);
    cfcCtx.fillStyle=c.c;
    cfcCtx.fillRect(-c.s/2,-c.s/4,c.s,c.s/2);
    cfcCtx.restore();
  });
  requestAnimationFrame(animConf);
}

function coverHTML(g) {
  const n = g.id + 1, c = COVERS[g.id] || COVERS[0];
  let burst = '';
  for (let k = 0; k < 8; k++) {
    const a = k * Math.PI / 4;
    burst += `<i style="--dx:${Math.round(Math.cos(a) * 70)}px;--dy:${Math.round(Math.sin(a) * 50)}px"></i>`;
  }
  return `<div class="cv-scene t${n}">${c.body}<div class="cv-head">${c.head}</div></div>` +
    `<span class="cv-tag">GIFT ${n}/4</span><div class="cv-burst">${burst}</div>` +
    pxSvg('gift', 'red', 'cv-open');
}

// Typewriter: the message types out like an RPG dialogue box; tap the card to skip.
let twTimer = null, twStart = null;
function stopTyping() { clearInterval(twTimer); clearTimeout(twStart); twTimer = twStart = null; }

function openModal(g) {
  mOpen = true;
  const gm = document.getElementById('gm');
  const card = gm.querySelector('.gb');
  const msg = document.getElementById('gmsg');
  const btn = card.querySelector('.gbc');
  card.className = 'gb gb-t' + (g.id + 1);
  document.getElementById('gcov').innerHTML = coverHTML(g);
  document.getElementById('gt').textContent = g.title;

  stopTyping();
  const chars = Array.from(g.msg);
  msg.innerHTML = '<span></span><span class="twr"></span>';
  const shown = msg.firstChild, rest = msg.lastChild;
  const finish = () => { stopTyping(); shown.textContent = g.msg; rest.textContent = ''; btn.classList.add('show'); };
  rest.textContent = g.msg;            // invisible copy keeps the card from growing while typing
  btn.classList.remove('show');
  card.onclick = e => { if (!btn.classList.contains('show')) { e.stopPropagation(); finish(); } };

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) finish();
  else {
    let i = 0;
    twStart = setTimeout(() => {
      twTimer = setInterval(() => {
        i++;
        shown.textContent = chars.slice(0, i).join('');
        rest.textContent = chars.slice(i).join('');
        if (i % 3 === 0 && chars[i - 1] !== ' ') tone(660 + (i * 37) % 260, 0.025, 'square', 0.02);
        if (i >= chars.length) finish();
      }, 28);
    }, 1100);
  }

  gm.classList.add('on');
  launchConfetti();
}

function closeModal() {
  mOpen = false;
  stopTyping();
  document.getElementById('gm').classList.remove('on');
}

// NFC SPLASH SCREEN
// ══════════════════════════════════════════
(function initNfc() {
  const params = new URLSearchParams(location.search);
  if(!params.has('nfc')) return;
  const splash = document.getElementById('nfcSplash');
  if(!splash) return;
  splash.style.display = 'flex';
  // swap the emoji for pixel-art Pranav, the hero of the quest
  const shroom = splash.querySelector('.nfc-shroom');
  if(shroom) shroom.innerHTML = pxSvg('pranav', 'pranav', '');
  const starsEl = document.getElementById('nfcStars');
  if(starsEl) {
    const fruits = ['strawberry','melon','banana','orange','cherry'];
    let html = '';
    for(let i=0;i<24;i++){            // fruit confetti: each piece has its own size, fall speed and spin
      const f = fruits[i%fruits.length], size = 18 + (i%3)*6, dur = 4 + Math.random()*3;
      html += pxSvg(f, f, 'nfc-conf').replace('<svg ', `<svg style="left:${(Math.random()*94).toFixed(1)}%;width:${size}px;height:${size}px;` +
              `animation-duration:${dur.toFixed(2)}s,${(1+Math.random()).toFixed(2)}s;animation-delay:-${(Math.random()*dur).toFixed(2)}s,0s" `);
    }
    for(let i=0;i<14;i++){            // twinkling pixel sparkles
      html += pxSvg('spark', i%2 ? 'spark' : 'coin', 'nfc-spark').replace('<svg ', `<svg style="left:${4+Math.random()*90}%;top:${4+Math.random()*90}%;animation-delay:${(Math.random()*1.6).toFixed(2)}s" `);
    }
    starsEl.innerHTML = html;
  }
  splash.addEventListener('click', ()=>{ splash.style.display='none'; }, {once:true});
})();

let running = false;

function draw(t) {
  dBg();
  dHills();
  dClouds(t);
  dGround();
  dPlats();
  dPipes();
  dDecor(t);
  dMushs(t);
  dPlayer();

}

  if(!running) return;
  update();
  tickParts();
  draw(t);
  requestAnimationFrame(loop);
}
